<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<title>Flask Todo App</title> 
<style> 
body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; } 
form { display: flex; gap: 10px; margin-bottom: 20px; } 
input[type="text"] { flex: 1; padding: 8px; } 
button { padding: 8px 16px; cursor: pointer; } 
ul { list-style: none; padding: 0; } 
li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px 
solid #ddd; } 
        .done { text-decoration: line-through; color: gray; } 
a { text-decoration: none; margin-left: 10px; } 
</style> 
</head> 
<body> 
<h2>My Todo List</h2> 
<form action="/add" method="POST"> 
<input type="text" name="title" placeholder="Enter a new task..." required> 
<button type="submit">Add</button> 
</form> 
<ul> 
{% for task in tasks %} 
<li> 
<span class="{{ 'done' if task.status == 1 else '' }}"> 
{{ task.title }} 
</span> 
<div> 
<a href="/complete/{{ task.id }}">✔</a> 
<a href="/delete/{{ task.id }}" style="color: red;">✖</a> 
</div> 
</li> 
{% endfor %} 
</ul> 
</body> 
</html>
